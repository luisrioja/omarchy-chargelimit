# omarchy-chargelimit configuration. Read by the bar widget (through sudo) and
# by the boot service. No restart needed: the next click picks up changes.

# Stop thresholds to cycle through (40-100). Order does not matter; the widget
# steps from high to low on left click / wheel up and back on right click.
PRESETS="100 90 80"

# Hysteresis: charging resumes only when the battery drops below stop - GAP.
GAP=5
